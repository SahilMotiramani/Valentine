<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card {
  background: white;
  padding: 30px 20px;
  width: 90%;
  max-width: 380px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
  animation: fadeIn 1s ease;
}

h1 {
  font-size: 24px;
  margin-bottom: 25px;
}

.buttons {
  position: relative;
  height: 90px;
}

button {
  padding: 12px 28px;
  font-size: 18px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  position: absolute;
}

#yesBtn {
  background: #e63946;
  color: white;
  left: 10%;
}

#noBtn {
  background: #bbb;
  right: 10%;
}

/* Success screen */
.success {
  display: none;
}

.success h1 {
  font-size: 28px;
  color: #e63946;
}

.success img {
  width: 100%;
  max-width: 260px;
  border-radius: 15px;
  margin: 15px 0;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

/* Confetti */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  background: red;
  top: -10px;
  animation: fall 3s linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}
</style>
</head>

<body>

<!-- 🎵 Background Music -->
<audio id="bgMusic" autoplay loop>
  <source src="love-story.mp4" type="audio/mpeg">
</audio>

<div class="card" id="questionCard">
  <h1>Bhavisha,<br>will you be my Valentine? 💖</h1>

  <div class="buttons">
    <button id="yesBtn">YES ❤️</button>
    <button id="noBtn" tabindex="-1">NO ❌</button>
  </div>
</div>

<div class="card success" id="successCard">
  <h1>💖 YAY!!! 💖</h1>
  <p>You made the correct decision 🥰</p>

  <!-- 🕺 GIF -->
  <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif" alt="Happy Dance">

  <p>I love you ❤️</p>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const questionCard = document.getElementById("questionCard");
const successCard = document.getElementById("successCard");
const music = document.getElementById("bgMusic");

/* Disable keyboard */
document.addEventListener("keydown", (e) => {
  e.preventDefault();
});

/* Floating NO button */
noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", moveNo);

function moveNo() {
  const x = Math.random() * 200 - 100;
  const y = Math.random() * 120 - 60;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

/* YES click */
yesBtn.addEventListener("click", () => {
  questionCard.style.display = "none";
  successCard.style.display = "block";
  launchConfetti();
  music.play();
});

/* Confetti generator */
function launchConfetti() {
  for (let i = 0; i < 80; i++) {
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.background = `hsl(${Math.random() * 360},100%,50%)`;
    confetti.style.animationDuration = Math.random() * 2 + 2 + "s";
    document.body.appendChild(confetti);

    setTimeout(() => confetti.remove(), 4000);
  }
}
</script>

</body>
</html>
